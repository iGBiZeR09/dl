set default=0
set timeout=2

insmod gfxterm
insmod vbe
insmod vga
terminal_output gfxterm

set gfxmode=1024x768x16
set gfxpayload=1024x768x16,1024x768

menuentry "Uefi - Windows Boot Manager (/EFI/Microsoft/Boot/bootmgfw.efi)" --class windows {
    echo Searching... /EFI/Microsoft/Boot/bootmgfw.efi
search --no-floppy --set -f /EFI/Microsoft/Boot/bootmgfw.efi

    echo Loading... kernel
chainloader (${root})/EFI/Microsoft/Boot/bootmgfw.efi

    echo Booting... /EFI/Microsoft/Boot/bootmgfw.efi
boot
}

menuentry "Uefi - Windows Boot Manager (/bootmgr.efi)" --class windows {
    echo Searching... /bootmgr.efi
search --no-floppy --set -f /bootmgr.efi

    echo Loading... kernel
chainloader (${root})/bootmgr.efi

    echo Booting... /bootmgr.efi
boot
}