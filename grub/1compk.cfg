set default=0
set timeout=2

set gfxmode=1024x768x16
set gfxpayload=1024x768x16,1024x768

set default=MiniOS

clear

menuentry "Usb - Linux Grub Boot Menu" {
    echo Searching... /boot/grub/grub.cfg
search --no-floppy --set -f /boot/grub/grub.cfg

    echo Loading...
configfile /boot/grub/grub.cfg
}
menuentry "Usb - MiniOS Linux x864" --id=MiniOS {
    echo Searching... /minios/config.conf
search --no-floppy --set -f /minios/config.conf

    echo Loading...
set prefix=($root)/minios/boot/grub
source $prefix/x86_64-efi/grub.cfg
configfile /minios/boot/grub/grub.cfg
}
menuentry "Uefi - Windows BCD Boot Menu (/EFI/microsoft/boot/bcd)" {configfile /minios/boot/grub/bootmgr.cfg}
menuentry "Usb - Porteus Linux x864" --id=Porteus {configfile /minios/boot/grub/porteus.cfg}
menuentry "Usb - SlaX64 Linux x864" --id=SlaX {configfile /minios/boot/grub/slax.cfg}
}
menuentry "Usb - Clover Bootloader Menu" {
    echo Searching... /EFI/boot/Clover.efi
search --no-floppy --set -f /EFI/boot/Clover.efi

    echo Loading...
chainloader (${root})/EFI/boot/Clover.efi

    echo Booting... /EFI/boot/Clover.efi
boot
}
menuentry "Usb - MiniOS Linux x864 - Direct" --id=MiniOSM {configfile /minios/boot/grub/miniosm.cfg}
menuentry "Usb - SSTR Grub4Dos Boot Menu" {
    echo Searching... /SSTR/grldr
search --no-floppy --set -f /SSTR/grldr

    echo Loading... kernel
ntldr (${root})/SSTR/grldr

    echo Booting... /SSTR/grldr
boot
}
menuentry "Dos - Clover Bootloader" {
    insmod iso9660
    insmod part_msdos
    insmod ext2
    insmod loopback
    search --no-floppy --set -f /HBCD/Clover.iso
    loopback clover /HBCD/Clover.iso
    chainloader (loop)
}
menuentry "Dos - HDD Regenerator" {
    insmod iso9660
    insmod part_msdos
    insmod ext2
    insmod loopback
    search --no-floppy --set -f /HBCD/HDDREG.iso
    loopback hddreg /HBCD/HDDREG.iso
    chainloader (loop)
}