set default=0
set timeout=2

insmod gfxterm
insmod vbe
insmod vga
terminal_output gfxterm

set gfxmode=1024x768x16
set gfxpayload=1024x768x16,1024x768
set default=Ask

clear

menuentry "Uefi - Slax64 Debian New2Ram" --id=New2Ram {
    echo Searching... /slax/boot/initrfs.img
search --no-floppy --set -f /slax/boot/initrfs.img

    echo Loading... kernel
linux /slax/boot/vmlinuz vga=normal load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 automount perchdir=ask toram

    echo Loading... initrd
initrd /slax/boot/initrfs.img

    echo Booting... Slax64
boot
}

