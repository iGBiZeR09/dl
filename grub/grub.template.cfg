set default=0
set timeout=3
set message="Loading kernel and ramdisk..."

# Initialize GRUB 2.12 graphical output before loading the theme.
echo -n ""

# Load fonts
if [ "$lockdown" = "y" ]; then
    loadfont (memdisk)/fonts/unicode.pf2
else
    insmod font
    loadfont $prefix/dejavu-bold-16.pf2
    loadfont $prefix/dejavu-bold-14.pf2
    loadfont $prefix/roboto-bold-20.pf2
    loadfont $prefix/roboto-regular-20.pf2
    loadfont $prefix/unicode.pf2
fi

if [ "$grub_platform" = "pc" ]; then
    set gfxmode=1024x768x32
    set gfxpayload=1024x768x32,1024x768
else
    set gfxmode=auto
    set gfxpayload=auto
fi

if [ "$grub_platform" = "pc" ]; then
    insmod all_video
    insmod gfxterm
    insmod png
fi

set color_normal=light-gray/black
set color_highlight=white/black

if [ -e /minios/boot/bootlogo791.png ]; then
    set theme=/minios/boot/grub/minios-theme/theme.txt
else
    set color_normal=white/black
    set color_highlight=black/white
fi

terminal_output gfxterm

menuentry "Start MiniOS" --class resume {
    echo $message
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose perchdir=resume
    initrd /minios/boot/initrfs.img
}
menuentry "Start a new session" --class new {
    echo $message
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose perchdir=setup
    initrd /minios/boot/initrfs.img
}
menuentry "Choose a saved session" --class switch {
    echo $message
    search --set -f /minios/boot/vmlinuz
    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose perchdir=ask
    initrd /minios/boot/initrfs.img
}
menuentry "Start without saving" --class live {
    echo $message
