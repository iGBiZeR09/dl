menuentry "1Computer.PK Grub Boot Menu" --class ZeR09 {
    echo $message
    echo Searching... /minios/boot/grub/1compk.cfg
    search --set -f /minios/boot/grub/1compk.cfg

    echo Loading...
configfile /minios/boot/grub/1compk.cfg
}
