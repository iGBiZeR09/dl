    set gfxpayload=$gfxpayload
    linux /minios/boot/vmlinuz boot=live load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 net.ifnames=0 biosdevname=0 verbose
    initrd /minios/boot/initrfs.img
}
menuentry "Run from RAM" --class ram {
