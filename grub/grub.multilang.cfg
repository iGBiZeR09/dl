set default=0
set timeout=3
set message="Loading kernel and ramdisk..."

# Initialize GRUB 2.12 graphical output before loading the theme.
echo -n ""

insmod regexp
insmod gettext
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
set localedir=$prefix/locale

# Language selection (title in theme)

# Language selection
menuentry "English" {
    lang="en_US"
    lang_utf="en_US.UTF-8"
    lang_timezone=""
    lang_keyboard=""
    export lang
    export lang_utf
    export lang_timezone
    export lang_keyboard
    configfile /minios/boot/grub/main.cfg
}
