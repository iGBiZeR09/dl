set default=0
set timeout=2

insmod gfxterm
insmod vbe
insmod vga
terminal_output gfxterm

set gfxmode=1024x768x16
set gfxpayload=1024x768x16,1024x768
set default=Direct

clear

menuentry "Usb - Porteus Linux x864 - Copy2Ram" --id=Copy2Ram {
    echo Searching... /porteus/initrd.xz
search --no-floppy --set -f /porteus/initrd.xz

    echo Loading... kernel
linux /porteus/vmlinuz noswap copy2ram timezone=Asia/Bangkok

    echo Loading... initrd
initrd /porteus/initrd.xz

    echo Booting... Porteus
boot
}

menuentry "Usb - Porteus Linux x864 - Direct" --id=Direct {
    echo Searching... /porteus/initrd.xz
search --no-floppy --set -f /porteus/initrd.xz

    echo Loading... kernel
linux /porteus/vmlinuz noswap timezone=Asia/Bangkok

    echo Loading... initrd
initrd /porteus/initrd.xz

    echo Booting... Porteus
boot
}